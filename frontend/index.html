<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Promptly - Chat with Nemotron 3 Ultra by NVIDIA">
    <title>Promptly - Nemotron 3 Ultra Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">Promptly</h1>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
            
            <div class="sidebar-content">
                <button class="new-chat-btn" id="newChatBtn" aria-label="New chat">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>New Chat</span>
                </button>
                
                <div class="chat-list" id="chatList" role="list" aria-label="Chat history">
                </div>
            </div>
            
            <div class="sidebar-footer">
                <button class="clear-all-btn" id="clearAllBtn" aria-label="Clear all chats">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                    <span>Clear All</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="chat-header">
                <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Open menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="chat-title">
                    <h2 id="currentChatTitle">New Chat</h2>
                    <span class="model-badge" id="modelBadge">Nemotron 3 Ultra</span>
                </div>
                <div class="chat-actions">
                    <button class="icon-btn" id="deleteChatBtn" aria-label="Delete chat" title="Delete chat">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="chat-container" id="chatContainer" role="log" aria-live="polite" aria-label="Chat messages">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-content">
                        <svg class="welcome-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <h2>Welcome to Promptly</h2>
                        <p>Start a conversation with AI. Type a message below to begin.</p>
                        <div class="welcome-examples">
                            <button class="example-btn" data-prompt="Write a Python function to implement binary search with type hints">Binary search in Python</button>
                            <button class="example-btn" data-prompt="Explain how transformers work in deep learning">Transformers explained</button>
                            <button class="example-btn" data-prompt="Optimize this SQL query for better performance: SELECT * FROM users WHERE created_at > '2024-01-01'">SQL optimization</button>
                            <button class="example-btn" data-prompt="Create a React component for a responsive navigation bar">React navbar component</button>
                        </div>
                    </div>
                </div>
                <div class="messages" id="messages"></div>
                <div class="typing-indicator" id="typingIndicator" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <form class="input-form" id="inputForm">
                <div class="input-wrapper">
                    <textarea 
                        class="message-input" 
                        id="messageInput" 
                        placeholder="Message Promptly..." 
                        rows="1"
                        aria-label="Type your message"
                        spellcheck="true"
                    ></textarea>
                    <div class="input-actions">
                        <button type="button" class="icon-btn" id="attachBtn" aria-label="Attach file" title="Attach file">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.49"></path>
                            </svg>
                        </button>
                        <button type="submit" class="send-btn" id="sendBtn" aria-label="Send message" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </div>
                <p class="input-hint">Press Enter to send, Shift+Enter for new line</p>
            </form>
        </main>
    </div>

    <div class="overlay" id="overlay" aria-hidden="true"></div>

    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <script>
      window.PROMPTLY_API_BASE = '__PROMPTLY_API_BASE__';
    </script>
    <script src="js/app.js"></script>
</body>
</html>
